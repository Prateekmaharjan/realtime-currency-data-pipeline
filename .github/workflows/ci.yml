name: Data Pipeline CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kafka-python requests python-dotenv

      - name: Check producer syntax
        run: python -m py_compile producer.py && echo "producer.py OK"

      - name: Check consumer syntax
        run: python -m py_compile consumer.py && echo "consumer.py OK"

      - name: Check warehouse syntax
        run: python -m py_compile warehouse.py && echo "warehouse.py OK"

      - name: Verify required files exist
        run: |
          test -f producer.py && echo "producer.py exists"
          test -f consumer.py && echo "consumer.py exists"
          test -f warehouse.py && echo "warehouse.py exists"
          test -f requirements.txt && echo "requirements.txt exists"
          test -f README.md && echo "README.md exists"
